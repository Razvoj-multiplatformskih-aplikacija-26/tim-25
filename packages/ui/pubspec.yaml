name: frizeraj_ui
description: Zajednička tema i prikazi Frizeraja.
publish_to: none
environment:
  sdk: ^3.13.5
resolution: workspace
dependencies:
  flutter:
    sdk: flutter
  domain: any
  flutter_svg: ^2.3.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  assets:
    - assets/icons/
    - assets/branding/logo.png
    - assets/branding/splash_symbol.png
    - assets/branding/splash_wordmark_white.png
  fonts:
    - family: FrizerajSans
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
