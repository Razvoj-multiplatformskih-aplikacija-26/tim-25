services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - queue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_SECONDS: ${SESSION_SECONDS:-3600}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set a development password}
      DEMO_BUSINESS_TIME: ${DEMO_BUSINESS_TIME:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:7357}
      DEV_HTTP: ${DEV_HTTP:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/server", "--healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  queue_data:
